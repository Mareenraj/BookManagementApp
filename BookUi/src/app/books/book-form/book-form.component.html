<!-- Back -->
<div class="mb-5">
    <a routerLink="/books" class="text-sm text-gray-500 hover:text-blue-600 transition-colors no-underline">
        ← Back to Books
    </a>
</div>

<!-- Form Card -->
<div class="bg-white border border-gray-200 rounded-lg max-w-lg mx-auto">

    <!-- Header -->
    <div class="px-5 py-4 border-b border-gray-100">
        <h1 class="text-lg font-semibold text-gray-900">
            {{ isEditMode ? 'Edit Book' : 'Add New Book' }}
        </h1>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="p-5 text-center text-sm text-gray-500">Loading book data...</div>

    <!-- Server Error -->
    <div *ngIf="serverError" class="mx-5 mt-4 p-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700">
        {{ serverError }}
    </div>

    <!-- Form -->
    <form *ngIf="!loading" (ngSubmit)="onSubmit()" class="p-5 space-y-4">

        <!-- Title -->
        <div>
            <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
            <input id="title" type="text" [(ngModel)]="formData.title" name="title" (blur)="markTouched('title')"
                placeholder="Enter book title" class="w-full px-3 py-2 rounded-lg text-sm border border-gray-300 bg-white
                    focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                [class.border-red-400]="titleError" />
            <p *ngIf="titleError" class="text-xs text-red-600 mt-1">{{ titleError }}</p>
        </div>

        <!-- Author -->
        <div>
            <label for="author" class="block text-sm font-medium text-gray-700 mb-1">Author *</label>
            <input id="author" type="text" [(ngModel)]="formData.author" name="author" (blur)="markTouched('author')"
                placeholder="Enter author name" class="w-full px-3 py-2 rounded-lg text-sm border border-gray-300 bg-white
                    focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                [class.border-red-400]="authorError" />
            <p *ngIf="authorError" class="text-xs text-red-600 mt-1">{{ authorError }}</p>
        </div>

        <!-- ISBN -->
        <div>
            <label for="isbn" class="block text-sm font-medium text-gray-700 mb-1">ISBN *</label>
            <input id="isbn" type="text" [(ngModel)]="formData.isbn" name="isbn" (blur)="markTouched('isbn')"
                placeholder="Enter 13-digit ISBN" maxlength="13" class="w-full px-3 py-2 rounded-lg text-sm font-mono border border-gray-300 bg-white
                    focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                [class.border-red-400]="isbnError" />
            <p *ngIf="isbnError" class="text-xs text-red-600 mt-1">{{ isbnError }}</p>
            <p *ngIf="!isbnError" class="text-xs text-gray-400 mt-1">13 digits, no hyphens</p>
        </div>

        <!-- Publication Date -->
        <div>
            <label for="publicationDate" class="block text-sm font-medium text-gray-700 mb-1">Publication Date *</label>
            <input id="publicationDate" type="date" [(ngModel)]="formData.publicationDate" name="publicationDate"
                (blur)="markTouched('publicationDate')" class="w-full px-3 py-2 rounded-lg text-sm border border-gray-300 bg-white
                    focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                [class.border-red-400]="dateError" />
            <p *ngIf="dateError" class="text-xs text-red-600 mt-1">{{ dateError }}</p>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-2 pt-2">
            <button type="submit" [disabled]="submitting || !isValid" class="px-5 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white hover:bg-blue-700
                     transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                {{ submitting ? 'Saving...' : (isEditMode ? 'Update Book' : 'Create Book') }}
            </button>
            <a routerLink="/books" class="px-5 py-2 rounded-lg text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200
                transition-colors cursor-pointer no-underline">
                Cancel
            </a>
        </div>
    </form>
</div>
